[project]
name = "asimovia-decision"
version = "1.0.0"
description = "A 17M-parameter byte-level decision model trained from random weights"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "safetensors>=0.4"]

[project.optional-dependencies]
bench = ["tinyjev>=0.1.3"]

[tool.setuptools]
packages = ["model", "data", "training", "serve", "bench"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
