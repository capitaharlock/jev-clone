[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "asimovia-decision"
version = "1.0.0"
description = "A 17M-parameter byte-level decision model trained from random weights"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "safetensors>=0.4"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
bench = ["tinyjev>=0.1.3"]

[project.scripts]
asimovia-serve = "asimovia.serve.server:main"
asimovia-bench = "asimovia.bench.run:main"
asimovia-report = "asimovia.bench.report:main"
asimovia-train = "asimovia.training.train:main"
asimovia-curriculum = "asimovia.training.loop:main"
asimovia-build-off = "asimovia.data.off_products:main"

[project.urls]
Repository = "https://github.com/capitaharlock/jev-clone"
Weights = "https://huggingface.co/capitaharlock/asimovia-decision-v1"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"asimovia.serve" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
