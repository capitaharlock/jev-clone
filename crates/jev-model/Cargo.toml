[package]
license = "MIT OR Apache-2.0"
name = "jev-model"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
half = { workspace = true }
jev-core = { path = "../jev-core" }
candle-core = { workspace = true }
candle-nn = { workspace = true }
tokenizers = { workspace = true }

[features]
default = []
# Apple GPU. Builds on any macOS host with the Metal toolchain (i.e. here).
metal = ["candle-core/metal", "candle-nn/metal"]
# Our CUDA code path: device selection, cfg-gated plumbing, error mapping.
# It compiles anywhere, because candle's `Device::new_cuda` exists in every
# build and returns `NotCompiledWithCudaSupport` when the kernels are absent.
cuda = []
# The actual CUDA kernels. `candle-kernels`' build script shells out to
# `nvcc`, so this feature only builds on a host with the CUDA toolkit —
# it is NOT enabled here and no CUDA number in our gate is measured.
cuda-kernels = ["cuda", "candle-core/cuda", "candle-nn/cuda"]

[dev-dependencies]
serde_json = { workspace = true }
