# .meshkore/public/jobs.yaml — Jobs registry (initiative jobs-and-links).
# Definitions only: a job is a command the daemon runs as its own child.
# Runtime state (pid/status/logs) lives in .meshkore/.runtime/ — never here.
# Agent-maintained via POST /jobs. Do not check in secrets.

version: 1

jobs:
  - id: dashboard
    name: "Dashboard de entrenamiento :8794"
    command: ".venv-train/bin/python tools/training_monitor.py --interval 60 --tick 20 --port 8794"
    cwd: "/Users/ricartjuncadella/Documents/Prj/asimovia/jev-clone"
    port: 8794
    notes: "UNICO frontend del cluster."
  - id: trainer
    name: "Entrenador (único) — edita el command por run"
    command: "env PYTHONPATH=. TOKENIZERS_PARALLELISM=false PYTORCH_ENABLE_MPS_FALLBACK=1 .venv-train/bin/python -m training.python.ce_finetune eval --checkpoint none --battery data/battery_dev.jsonl --device mps --out artifacts/gates/T-ce-finetune/eval-none.json && env PYTHONPATH=. TOKENIZERS_PARALLELISM=false PYTORCH_ENABLE_MPS_FALLBACK=1 .venv-train/bin/python -m training.python.ce_finetune train --episodes artifacts/episodes-qwen/pilot-2k --weights minilmv2-l6-mnli-xnli --init none --out artifacts/checkpoints/ce/smoke-1k --device mps --seed 20260926 --epochs 4 --lr-encoder 2e-5 --lr-head 1e-4 --decisions-per-batch 8 --eval-every 250 --budget 1000 --holdout 0.2 --split-seed 20260927 && env PYTHONPATH=. TOKENIZERS_PARALLELISM=false PYTORCH_ENABLE_MPS_FALLBACK=1 .venv-train/bin/python -m training.python.ce_finetune gate --run artifacts/checkpoints/ce/smoke-1k --control artifacts/gates/T-ce-finetune/eval-none.json --out artifacts/gates/T-ce-finetune/smoke.json"
    cwd: "/Users/ricartjuncadella/Documents/Prj/asimovia/jev-clone"
    notes: "UNICO job de entrenamiento. Para otro experimento se EDITA este command (borrar + POST con el mismo id), no se crea otro job. Run actual: smoke de #T-ce-finetune (seccion B): control none + 1000 decisiones del piloto parcial con split provisional 80/20 por variant_group + gate contra el control en artifacts/gates/T-ce-finetune/smoke.json. Un solo entreno a la vez; se lanza cuando datagen ha terminado (comparte la GPU con ollama MLX)."
  - id: evalgate
    name: "Evaluacion / gates (unico)"
    command: "env PYTHONPATH=. .venv-train/bin/python -m eval.preflight_refs refs --only qwen-local --no-table"
    cwd: "/Users/ricartjuncadella/Documents/Prj/asimovia/jev-clone"
    notes: "UNICO job de evaluacion: preflight, eval.unseen, release_gate. Se edita el command. Run actual: columna qwen-local de #T-preflight-refs (4 peticiones en vuelo sobre el unico servidor ollama)."
  - id: ollama
    name: "Ollama local (Qwen) :11434"
    command: "/opt/homebrew/bin/ollama serve"
    cwd: "/Users/ricartjuncadella/Documents/Prj/asimovia/jev-clone"
    port: 11434
    env:
      OLLAMA_NUM_PARALLEL: "4"
    notes: "UNICO servicio de modelo local (profesor Qwen). NUM_PARALLEL=4: las referencias del piloto preguntan 400 filas y con 1 slot se serializan."
  - id: datagen
    name: "Generador de datos (único)"
    command: "nice -n 10 env EPISODE_GEN_BULK=1 PYTHONPATH=. .venv-train/bin/python -u -m data.episode_gen run --n 2100 --seed 20260926 --prose qwen --teacher qwen --concurrency 2 --batch 10 --out artifacts/episodes-qwen/pilot-2k --resume && env PYTHONPATH=. .venv-train/bin/python -m data.episode_gen gate --dir artifacts/episodes-qwen/pilot-2k --job-id datagen && env PYTHONPATH=. .venv-train/bin/python -u -m data.episode_verify run --dir artifacts/episodes-qwen/pilot-2k --batch 20 --concurrency 2 > artifacts/episodes-qwen/pilot-2k/verify.log 2>&1 && env PYTHONPATH=. .venv-train/bin/python -m data.episode_verify gate --dir artifacts/episodes-qwen/pilot-2k"
    cwd: "/Users/ricartjuncadella/Documents/Prj/asimovia/jev-clone"
    notes: "UNICO job de generacion de corpus. Run actual: piloto de #T-episode-gen, 2100 episodios (2000 exigidos + 5% de holgura). Lote 10, no 16: a 16 el modelo suelta el tramo KEEP y solo 38 de 100 quedaban con prosa de Qwen; a 10 fueron 18 de 20, al mismo coste. --resume (2026-09-27): el run murio a 1394 y sin resume un relanzamiento sobrescribe episodes.jsonl; con resume retoma en el item que toca (mismo --n y --seed). Al terminar firma el gate el propio job. **Profesor MEZCLADO (2026-09-27, decisión del operador):** el piloto terminó con 1794 episodios de qwen3.6:27b-mlx y 298 de qwen3.8:27b-mlx — se cambió el modelo local a mitad. Distinguibles: desde el cambio cada episodio lleva `teacher_trace.model`; los que NO tienen ese campo son de qwen3.6. Tenerlo en cuenta en cualquier gate o comparación que asuma un solo profesor. Encadenado (2026-09-27, #T-episode-verify): tras el gate corre el verificador separado (regla + auditor Qwen con prompt distinto + muestra humana + embudo) sobre el mismo directorio y firma su gate; un solo run de Qwen a la vez, por eso va en la misma cadena y no en otro job."
