# .meshkore/public/jobs.yaml — Jobs registry (initiative jobs-and-links).
# Definitions only: a job is a command the daemon runs as its own child.
# Runtime state (pid/status/logs) lives in .meshkore/.runtime/ — never here.
# Agent-maintained via POST /jobs. Do not check in secrets.

version: 1

jobs:
  - id: dashboard
    name: "Dashboard de entrenamiento :8794"
    command: ".venv-train/bin/python tools/training_monitor.py --interval 60 --tick 20 --port 8794"
    cwd: "/Users/ricartjuncadella/Documents/Prj/asimovia/jev-clone"
    port: 8794
    notes: "UNICO frontend del cluster."
  - id: evalgate
    name: "Evaluacion / gates (unico)"
    command: "env PYTHONPATH=. .venv-train/bin/python -m eval.preflight_refs refs --only qwen-local --no-table"
    cwd: "/Users/ricartjuncadella/Documents/Prj/asimovia/jev-clone"
    notes: "UNICO job de evaluacion: preflight, eval.unseen, release_gate. Se edita el command. Run actual: columna qwen-local de #T-preflight-refs (4 peticiones en vuelo sobre el unico servidor ollama)."
  - id: ollama
    name: "Ollama local (Qwen) :11434"
    command: "/opt/homebrew/bin/ollama serve"
    cwd: "/Users/ricartjuncadella/Documents/Prj/asimovia/jev-clone"
    port: 11434
    env:
      OLLAMA_NUM_PARALLEL: "4"
    notes: "UNICO servicio de modelo local (profesor Qwen). NUM_PARALLEL=4: las referencias del piloto preguntan 400 filas y con 1 slot se serializan."
  - id: qwen38-ref
    name: "Qwen 3.8 sobre la batería de desarrollo (#T-qwen38-ref)"
    command: "env PYTHONPATH=. OLLAMA_NUM_PARALLEL=4 QWEN_MODEL=qwen3.8:27b-mlx python3 -u -m eval.qwen38_ref measure"
    cwd: "/Users/ricartjuncadella/Documents/Prj/asimovia/jev-clone"
    notes: "Paso 1 del bucle (docs/bucle-infinito.md §8): mide la columna del profesor NUEVO sobre las MISMAS 400 filas de desarrollo del 3.6 y firma el gate con la decisión de qué QWEN_MODEL usa el productor. Reanudable: el log de picks (artifacts/gates/T-qwen38-ref/columns/qwen-local-3.8.picks.jsonl) es el estado, relanzar el mismo comando retoma donde iba. Fila a fila con teacher_structured, NO por lote: el 3.6 se midió así y cambiar de protocolo dejaría de comparar. Medido el 2026-09-27: ~3,3 filas/min con OLLAMA_NUM_PARALLEL=4 (ya en el servidor) → ≈ 2 h, no los 15 min que estimaba la task. Un solo run de Qwen a la vez: no arrancar `datagen` mientras este viva."
  - id: datagen
    name: "Generador de datos (único)"
    command: "env PYTHONPATH=. .venv-train/bin/python -u -m data.rule_variety publish --batch 1 --n 50000 --variety 16 && env PYTHONPATH=. .venv-train/bin/python -u -m data.rule_variety gate --dir artifacts/episodes-rule/batch-0001 --required 50000"
    cwd: "/Users/ricartjuncadella/Documents/Prj/asimovia/jev-clone"
    notes: "UNICO job de generacion de corpus; se EDITA el command por run (borrar + POST con el mismo id). Run actual (2026-09-27, #T-numeric-gen): lote 1 del generador por REGLA, 50 000 episodios de attribute_comparison + priority_decision con variedad 16 (15 atributos, formatos numericos mezclados, superlativo/ordinal/umbral/empate, K en 2-3-8, cuatro variantes por grupo). CPU puro, sin Qwen: ~6 500 episodios/s, el lote tarda segundos. Al terminar firma la seccion `generator` de artifacts/gates/T-numeric-gen/gate.json (validador, variedad, chi2 de la posicion del gold, contrafactuales, fuga contra dev Y sellado, volumen). Historia previa: este job corrio el piloto de #T-episode-gen (2 100 episodios con Qwen, profesor MEZCLADO 3.6/3.8 distinguible por teacher_trace.model) y su verificador #T-episode-verify; ese run esta publicado en artifacts/episodes-qwen/pilot-2k con su manifest y su gate."
  - id: trainer
    name: "Entrenador (único) — edita el command por run"
    command: "env PYTHONPATH=. .venv-train/bin/python -m eval.numeric_value mix --rule artifacts/episodes-rule/batch-0001 --pilot artifacts/episodes-qwen/pilot-2k/verified.jsonl --n-rule 5000 --out artifacts/episodes-rule/mix-smoke && env PYTHONPATH=. TOKENIZERS_PARALLELISM=false PYTORCH_ENABLE_MPS_FALLBACK=1 .venv-train/bin/python -m training.python.ce_finetune eval --checkpoint none --battery data/battery_dev.jsonl --device mps --out artifacts/gates/T-numeric-gen/eval-none.json && env PYTHONPATH=. TOKENIZERS_PARALLELISM=false PYTORCH_ENABLE_MPS_FALLBACK=1 .venv-train/bin/python -u -m training.python.ce_finetune train --episodes artifacts/episodes-rule/mix-smoke --weights minilmv2-l6-mnli-xnli --init none --out artifacts/checkpoints/ce/numeric-5k --device mps --seed 20260926 --epochs 4 --lr-encoder 2e-5 --lr-head 1e-4 --decisions-per-batch 8 --eval-every 1250 --budget 5000 --holdout 0.2 --split-seed 20260927 ; env PYTHONPATH=. TOKENIZERS_PARALLELISM=false PYTORCH_ENABLE_MPS_FALLBACK=1 .venv-train/bin/python -m training.python.ce_finetune gate --run artifacts/checkpoints/ce/numeric-5k --control artifacts/gates/T-numeric-gen/eval-none.json --out artifacts/gates/T-numeric-gen/smoke.json ; env PYTHONPATH=. TOKENIZERS_PARALLELISM=false PYTORCH_ENABLE_MPS_FALLBACK=1 .venv-train/bin/python -u -m eval.numeric_value measure --run artifacts/checkpoints/ce/numeric-5k --mix artifacts/episodes-rule/mix-smoke && env PYTHONPATH=. .venv-train/bin/python -m eval.numeric_value gate --run artifacts/checkpoints/ce/numeric-5k"
    cwd: "/Users/ricartjuncadella/Documents/Prj/asimovia/jev-clone"
    notes: "UNICO job de entrenamiento; se EDITA el command por run (borrar + POST con el mismo id). Run actual (2026-09-27, #T-numeric-gen punto 5 — prueba de valor): mismo comando que smoke.json con --budget 5000 sobre la mezcla de 5 000 episodios por regla (lote 1, muestra por GRUPO equilibrada entre las cuatro celdas) + el piloto verificado (1 840). Cadena: mix -> control `none` en dev -> train 5 000 decisiones -> gate de dev -> measure del holdout del piloto por familia (control y ajustado sobre las MISMAS filas, bootstrap pareado) -> gate de la task. Los dos `gate` salen con exit 1 en NO-GO, asi que van con `;` y no con `&&`: un NO-GO es un resultado, no un fallo de la cadena, y el job puede aparecer como `failed` con todo medido. La prediccion esta escrita ANTES en artifacts/gates/T-numeric-gen/gate.json (seccion value_proof_prediction). Un solo entreno a la vez: se lanza cuando datagen y qwen38-ref han terminado (comparten GPU con ollama MLX)."
